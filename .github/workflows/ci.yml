name: Verify tutorial pipeline
on: [push, pull_request, workflow_dispatch]

# Supersede obsolete commits within the same event/ref, but never let a push
# cancel the required pull_request checks (or vice versa). The latest head
# must still pass both Linux and macOS before an operator merges the PR.
concurrency:
  group: tutorial-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng xvfb
      - run: npm test
      - run: npm run test:cloud:docker
      - run: npm run test:e2e
      - run: npm run test:studio:e2e
      - run: npm run test:hostinger:e2e
      - run: npm run test:goal:e2e
      - run: npm run test:narration:e2e
      - run: npm run test:privacy:e2e
      - run: xvfb-run -a npm run test:iframe-session:e2e
      - run: npm run test:discovery-public:e2e
      - run: npm run benchmark -- output/e2e-demo/tutorial.mp4
      - run: npm run test:webreel:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-evidence
          path: output/
          retention-days: 7

  postgres-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tutorial-test
          POSTGRES_DB: tutorial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tutorial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Verify distributed publish-lock semantics against PostgreSQL
        run: node --test test/cloud-coordination-postgres.integration.test.mjs
        env:
          COORDINATION_DATABASE_URL: postgres://postgres:tutorial-test@localhost:5432/tutorial_test

  macos-regression:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: 'echo "macOS runner architecture: $(uname -m)"'
      - run: npm ci
      - run: npx playwright install chromium
      - run: brew install ffmpeg espeak-ng
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:studio:e2e
      - run: npm run test:hostinger:e2e
      - run: npm run test:goal:e2e
      - run: npm run test:narration:e2e
      - run: npm run test:privacy:e2e
      - run: SKIP_HEADED_SESSION=1 npm run test:iframe-session:e2e
      - run: npm run test:discovery-public:e2e
      - run: npm run benchmark -- output/e2e-demo/tutorial.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-macos-evidence
          path: output/
          retention-days: 7

  consolidate-audited-branches:
    # Audit + Linux CI must pass before pruning already-merged branch refs.
    # macOS regression remains independent and is still required for quality acceptance;
    # unavailable macOS runner capacity must not block safe ref-only housekeeping.
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove only audited branches whose history is preserved in main
        run: node scripts/consolidate-branches.mjs --apply
