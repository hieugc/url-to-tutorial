name: Verify tutorial pipeline
on: [push, pull_request, workflow_dispatch]

# Supersede obsolete commits within the same event/ref, but never let a push
# cancel the required pull_request checks (or vice versa). The latest head
# must still pass both Linux and macOS before an operator merges the PR.
concurrency:
  group: tutorial-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: brew install ffmpeg espeak-ng
      - run: npm test
      - run: npm run test:cloud:docker
      - run: npm run test:e2e
      - run: npm run test:studio:e2e
      - run: npm run test:hostinger:e2e
      - run: npm run test:goal:e2e
      - run: npm run test:narration:e2e
      - run: npm run test:privacy:e2e
      - run: npm run test:iframe-session:e2e
      - run: npm run test:discovery-public:e2e
      - run: >-
          node --input-type=module -e "import { readdir, stat } from 'node:fs/promises'; import { join } from 'node:path'; import { inspectVideo } from './src/benchmark.mjs'; const dirs = (await readdir('output')).filter(name => name.startsWith('e2e-demo-')); const files = await Promise.all(dirs.map(async name => ({ name, mtime: (await stat(join('output', name, 'tutorial.mp4'))).mtimeMs }))); const latest = files.sort((a, b) => b.mtime - a.mtime)[0]; if (!latest) throw new Error('No E2E demo output found'); console.log(JSON.stringify(await inspectVideo(join('output', latest.name, 'tutorial.mp4'))));"
      - run: npm run test:webreel:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-evidence
          path: output/
          retention-days: 7

  postgres-coordination:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Start isolated PostgreSQL for integration tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name tutorial-ci-postgres --env POSTGRES_PASSWORD=tutorial-test --env POSTGRES_DB=tutorial_test --publish 54329:5432 postgres:16-alpine
          for attempt in {1..30}; do
            if docker exec tutorial-ci-postgres pg_isready -U postgres -d tutorial_test; then
              break
            fi
            sleep 2
          done
          docker exec tutorial-ci-postgres pg_isready -U postgres -d tutorial_test
      - name: Verify distributed publish-lock semantics against PostgreSQL
        run: node --test test/cloud-coordination-postgres.integration.test.mjs test/cloud-rollout-postgres.integration.test.mjs test/cloud-break-glass-postgres.integration.test.mjs test/cloud-certificate-postgres.integration.test.mjs
        env:
          COORDINATION_DATABASE_URL: postgres://postgres:tutorial-test@localhost:54329/tutorial_test
      - name: Stop PostgreSQL container
        if: always()
        run: docker stop tutorial-ci-postgres || true

  macos-regression:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: 'echo "macOS runner architecture: $(uname -m)"'
      - run: npm ci
      - run: npx playwright install chromium
      - run: brew install ffmpeg espeak-ng
      - run: npm test
      - run: npm run test:e2e
      - name: UTV-001 CLI demo and Mac resource profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/utv001-cli-demo
          {
            printf 'timestamp_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'macos_version=%s\n' "$(sw_vers -productVersion)"
            printf 'cpu_brand=%s\n' "$(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown)"
            printf 'physical_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"
            printf 'node_version=%s\n' "$(node --version)"
            printf 'npm_version=%s\n' "$(npm --version)"
          } > output/utv001-cli-demo/system-info.txt
          /usr/bin/time -l npm run demo -- --out output/utv001-cli-demo \
            > output/utv001-cli-demo/demo.stdout.log \
            2> output/utv001-cli-demo/resource-usage.txt
          npm run benchmark -- output/utv001-cli-demo/tutorial.mp4 \
            > output/utv001-cli-demo/video-benchmark.json
      - run: npm run test:studio:e2e
      - run: npm run test:hostinger:e2e
      - run: npm run test:goal:e2e
      - run: npm run test:narration:e2e
      - run: npm run test:privacy:e2e
      - run: npm run test:iframe-session:e2e
      - run: npm run test:discovery-public:e2e
      - run: >-
          node --input-type=module -e "import { readdir, stat } from 'node:fs/promises'; import { join } from 'node:path'; import { inspectVideo } from './src/benchmark.mjs'; const dirs = (await readdir('output')).filter(name => name.startsWith('e2e-demo-')); const files = await Promise.all(dirs.map(async name => ({ name, mtime: (await stat(join('output', name, 'tutorial.mp4'))).mtimeMs }))); const latest = files.sort((a, b) => b.mtime - a.mtime)[0]; if (!latest) throw new Error('No E2E demo output found'); console.log(JSON.stringify(await inspectVideo(join('output', latest.name, 'tutorial.mp4'))));"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-macos-evidence
          path: output/
          retention-days: 7

  consolidate-audited-branches:
    # Audit + CI must pass before pruning already-merged branch refs.
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove only audited branches whose history is preserved in main
        run: node scripts/consolidate-branches.mjs --apply
