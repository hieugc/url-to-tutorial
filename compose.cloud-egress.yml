services:
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.egress-proxy
    image: url-to-tutorial-egress-proxy:local
    container_name: url-tutorial-egress-proxy
    environment:
      EGRESS_PROXY_HOST: 0.0.0.0
      EGRESS_PROXY_PORT: "3128"
      EGRESS_PROXY_MAX_CONNECTIONS: "64"
    expose:
      - "3128"
    networks:
      - internet_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped

networks:
  internet_egress:
    name: url-tutorial-egress
    driver: bridge
